<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14183a">
<title>헤맨 만큼 내 땅이다</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.9/dist/galmuri.css">
<style>
:root{
  --bg:#14183a; --bg2:#1c2150; --tile:#262c63; --tile2:#2f3676; --edge:#0c0f28;
  --ink:#f5f3ff; --ink2:#b9bce6; --ink3:#7f84bd;
  --gold:#ffd23f; --gold-d:#c99a00;
  --c1:#ffe45c; --c2:#ff5cad; --c3:#a6f04d; --c4:#a97cff; --c5:#4de8ff; --c6:#ffa050;
  --px:"Galmuri11","Galmuri9",Pretendard,sans-serif;
  --step:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;touch-action:manipulation}
/* 아주 옅은 모눈: 픽셀아트 도안 종이 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:28px 28px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}

/* 계단 모서리 (픽셀 타일) */
.px{clip-path:polygon(0 var(--step),var(--step) var(--step),var(--step) 0,calc(100% - var(--step)) 0,calc(100% - var(--step)) var(--step),100% var(--step),100% calc(100% - var(--step)),calc(100% - var(--step)) calc(100% - var(--step)),calc(100% - var(--step)) 100%,var(--step) 100%,var(--step) calc(100% - var(--step)),0 calc(100% - var(--step)))}

.screen{position:fixed;inset:0;display:none;padding:max(18px,env(safe-area-inset-top)) clamp(16px,2.4vw,32px) max(16px,env(safe-area-inset-bottom))}
.screen.on{display:flex}

/* ---------- 1. 번호 판 ---------- */
#home{align-items:center;justify-content:center;gap:clamp(24px,5vw,72px)}
.hero{max-width:420px}
.kicker{font-family:var(--px);font-weight:700;font-size:15px;color:var(--gold);letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.kicker svg{width:16px;height:16px}
.hero h1{font-family:var(--px);font-weight:700;font-size:clamp(40px,5.4vw,68px);line-height:1.12;margin:14px 0 18px;letter-spacing:-.01em;
  text-shadow:0 4px 0 var(--edge)}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;font-size:clamp(17px,1.7vw,21px);line-height:1.6;color:var(--ink2)}
.hero p b{color:var(--ink)}
.meter{margin-top:28px}
.meter .lab{font-family:var(--px);font-weight:700;font-size:14px;color:var(--ink3);display:flex;justify-content:space-between;margin-bottom:8px}
.meter .lab b{color:var(--ink);font-weight:400}
.cells{display:grid;grid-template-columns:repeat(var(--n,25),1fr);gap:3px;height:16px}
.cells i{background:var(--tile)}
.cells i.on{background:var(--gold)}

#nums{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,1.1vw,14px);width:min(560px,92vw)}
.num{--step:7px;aspect-ratio:1/1;background:var(--tile);position:relative;
  font-family:var(--px);font-weight:700;font-size:clamp(30px,3.6vw,44px);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.07);transition:transform .08s}
.num:active{transform:translateY(3px)}
.num.done{background:#2b5b4c;color:#d7ffe9}
.num.done .flag{position:absolute;top:9px;right:9px;width:18px;height:18px;color:var(--c3)}
.num:not(.done) .flag{display:none}

#hold{position:fixed;right:0;bottom:0;width:120px;height:80px;display:flex;align-items:flex-end;justify-content:flex-end;
  padding:0 16px 14px 0;font-family:var(--px);font-weight:700;font-size:13px;color:#3d4380}
#hold .ring{width:22px;height:22px;margin-right:8px;opacity:0;transition:opacity .15s}
#hold.holding .ring{opacity:1}
#hold .ring circle{transition:none}

/* ---------- 2. 땅 고르기 ---------- */
#pick{flex-direction:column;gap:clamp(10px,1.6vh,16px)}
.pickhead{display:flex;align-items:center;gap:clamp(10px,1.4vw,18px);flex-wrap:nowrap}
.pickhead > *{flex:none}
.pickhead .ask{flex:1 1 auto;min-width:0}
.pickhead .ask small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1180px){ .pickhead .ask small{display:none} }
@media (max-width:1100px){ .slot{min-width:0!important;max-width:118px;flex:0 1 118px} .slot.full{font-size:13px;padding:0 8px;white-space:nowrap;overflow:hidden} .pickhead .back{padding:0 6px} }
.who{--step:5px;background:var(--gold);color:#2a2000;font-family:var(--px);font-weight:700;font-size:clamp(24px,2.6vw,32px);
  padding:10px 18px;box-shadow:inset 0 -5px 0 var(--gold-d)}
.ask{font-size:clamp(18px,1.9vw,24px);font-weight:700;line-height:1.3}
.ask small{display:block;font-size:clamp(13px,1.2vw,15px);font-weight:500;color:var(--ink3);margin-top:3px}
.slots{display:flex;gap:8px;margin-left:auto}
.slot{--step:5px;min-width:clamp(92px,10vw,140px);height:52px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;outline:2px dashed #3a4182;outline-offset:-2px;color:var(--ink3);font-family:var(--px);font-weight:700;font-size:15px}
.slot.full{outline:0;background:var(--cc);color:#1a1530;font-family:Pretendard,sans-serif;font-weight:800;font-size:clamp(14px,1.35vw,17px);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.slot .k{font-family:var(--px);font-weight:700;font-size:13px;opacity:.7}
.go{--step:6px;height:52px;padding:0 26px;background:var(--gold);color:#2a2000;font-family:var(--px);font-weight:700;font-size:20px;
  box-shadow:inset 0 -5px 0 var(--gold-d);transition:transform .08s,filter .2s}
.go:disabled{background:#2a3068;color:#5a609e;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
.go:not(:disabled){animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.back{height:52px;padding:0 16px;color:var(--ink3);font-family:var(--px);font-weight:700;font-size:15px}

#board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,.9vw,12px)}
.col{display:grid;grid-template-rows:auto repeat(8,minmax(0,1fr));gap:clamp(5px,.7vh,8px);min-height:0}
.colh{font-family:var(--px);font-weight:700;font-size:clamp(13px,1.25vw,16px);color:var(--cc);display:flex;align-items:center;gap:7px;padding:2px 2px 4px;white-space:nowrap;overflow:hidden}
.colh::before{content:"";width:10px;height:10px;background:var(--cc);flex:none;box-shadow:2px 2px 0 var(--edge)}
.land{--step:5px;position:relative;background:var(--tile);text-align:left;padding:0 10px 0 16px;display:flex;align-items:center;min-height:0;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 5px 0 0 var(--cc);transition:transform .08s,background .12s}
.land:active{transform:translateY(2px)}
.land .nm{font-weight:700;font-size:clamp(14px,1.55vw,21px);line-height:1.2;word-break:keep-all}
.land .pg{position:absolute;right:8px;bottom:7px;font-family:var(--px);font-weight:700;font-size:11px;color:var(--ink3)}
.land .badge{position:absolute;top:6px;right:7px;width:24px;height:24px;display:none;align-items:center;justify-content:center;
  background:#1a1530;color:var(--cc);font-family:var(--px);font-weight:700;font-size:14px}
.land.sel{background:var(--cc);color:#1a1530;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 0 0 3px var(--bg),0 0 0 5px var(--cc)}
.land.sel .badge{display:flex}
.land.sel .pg{color:rgba(26,21,48,.55)}
.land.dim{opacity:.38}
.land.own{background:repeating-linear-gradient(45deg,var(--tile) 0 8px,var(--tile2) 8px 16px)}
.land.own.sel{background:var(--cc)}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}

/* ---------- 3. 내 땅 공개 ---------- */
#reveal{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(18px,3vh,30px)}
#reveal h2{font-family:var(--px);font-weight:700;font-size:clamp(30px,3.8vw,48px);margin:0;text-shadow:0 4px 0 var(--edge)}
#reveal h2 em{font-style:normal;color:var(--gold)}
.four{display:flex;gap:clamp(10px,1.6vw,20px);flex-wrap:wrap;justify-content:center}
.card{--step:8px;width:clamp(140px,17vw,210px);aspect-ratio:3/4;background:var(--cc);color:#1a1530;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.22),inset 0 6px 0 rgba(255,255,255,.25)}
.card .t{font-family:var(--px);font-weight:700;font-size:14px;opacity:.75}
.card .n{font-weight:800;font-size:clamp(22px,2.4vw,30px);line-height:1.2;word-break:keep-all}
.card .p{font-family:var(--px);font-weight:700;font-size:13px;opacity:.6}
.card svg{width:34px;height:34px}
.card.mystery{background:var(--tile);color:var(--ink);box-shadow:inset 0 -8px 0 rgba(0,0,0,.3),0 0 0 3px var(--bg),0 0 0 6px var(--gold)}
.card.mystery .n{font-size:clamp(20px,2.2vw,28px)}
.card.rand{background:var(--gold);box-shadow:inset 0 -8px 0 var(--gold-d),inset 0 6px 0 rgba(255,255,255,.35),0 0 0 3px var(--bg),0 0 0 6px var(--gold),0 0 40px rgba(255,210,63,.45)}
.card.land-in{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(.7) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
.card.pop{animation:pop .45s steps(4)}
@keyframes pop{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
.rnote{font-size:clamp(15px,1.5vw,18px);color:var(--ink2);min-height:1.5em}
.next{--step:6px;height:60px;padding:0 34px;background:var(--gold);color:#2a2000;font-family:var(--px);font-weight:700;font-size:21px;
  box-shadow:inset 0 -5px 0 var(--gold-d)}
.next:disabled{opacity:0}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;width:10px;height:10px;top:-12px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}

/* ---------- 4. 선생님 ---------- */
#teacher{flex-direction:column;overflow:auto;gap:14px}
.thead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.thead h2{font-family:var(--px);font-weight:700;font-size:26px;margin:0;flex:1}
.tb{--step:5px;height:46px;padding:0 18px;background:var(--tile);font-family:var(--px);font-weight:700;font-size:15px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.28)}
.tb.gold{background:var(--gold);color:#2a2000;box-shadow:inset 0 -4px 0 var(--gold-d)}
.tb.warn{background:#5a2238;color:#ffc2d4}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.panel{--step:8px;background:var(--bg2);padding:18px 20px}
.panel h3{font-family:var(--px);font-weight:700;font-size:17px;margin:0 0 12px;color:var(--gold);font-weight:400;display:flex;justify-content:space-between;gap:10px}
.panel h3 span{color:var(--ink2)}
.big{font-family:var(--px);font-weight:700;font-size:40px}
.big small{font-size:18px;color:var(--ink3)}
.miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.miss i{font-style:normal;font-family:var(--px);font-weight:700;font-size:15px;background:var(--tile);padding:6px 10px}
.prints{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pr{display:flex;align-items:center;gap:8px;background:var(--tile);padding:8px 10px;box-shadow:inset 4px 0 0 var(--cc)}
.pr .pg{font-family:var(--px);font-weight:700;font-size:12px;color:var(--ink3);width:30px}
.pr .nm{flex:1;font-weight:700;font-size:15px;word-break:keep-all}
.pr .ct{font-family:var(--px);font-weight:700;font-size:18px;color:var(--gold)}
.pr.zero{opacity:.35}
.pr.zero .ct{color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 6px;border-bottom:1px solid #2a2f66;vertical-align:middle}
td:first-child{font-family:var(--px);font-weight:700;width:44px;color:var(--ink2)}
.tag{display:inline-block;padding:3px 8px;margin:2px 3px 2px 0;background:var(--cc);color:#1a1530;font-weight:700;font-size:13px}
.tag.r{background:var(--gold)}
.tag.r::before{content:"🎲 "}
.setrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.setrow label{font-size:16px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.setrow input{font:inherit;font-family:var(--px);font-weight:700;font-size:18px;width:76px;padding:8px 10px;background:var(--tile);color:var(--ink);border:0}
.note{font-size:14px;color:var(--ink3);margin-top:10px;line-height:1.5}

/* ---------- 글자 키우기 (11/19 사용자: 너무 작다) ---------- */
.kicker{font-size:19px}.kicker svg{width:20px;height:20px}
.hero p{font-size:clamp(20px,2vw,26px)}
.meter .lab{font-size:18px}
#hold{font-size:16px}
.who{font-size:clamp(28px,3vw,38px);padding:10px 20px}
.ask{font-size:clamp(21px,2.2vw,29px)}
.ask small{font-size:clamp(16px,1.5vw,19px)}
.first{display:inline-flex;align-items:center;gap:6px;margin-top:5px;padding:3px 10px;background:var(--gold);color:#2a2000;font-size:clamp(15px,1.4vw,18px);font-weight:800}
.slot,.go,.back{height:60px}
.slot{font-size:18px}
.slot.full{font-size:clamp(16px,1.6vw,20px)}
.slot .k{font-size:16px}
.go{font-size:24px;padding:0 28px}
.back{font-size:19px}
.colh{font-size:clamp(16px,1.6vw,20px)}
.colh::before{width:12px;height:12px}
.land .nm{font-size:clamp(18px,2vw,27px)}
.land .pg{font-size:14px}
.land .badge{width:30px;height:30px;font-size:17px}
.land{padding-right:40px}
.land.fixed{background:var(--gold);color:#2a2000;box-shadow:inset 0 -5px 0 var(--gold-d),0 0 0 3px var(--bg),0 0 0 5px var(--gold);cursor:default}
.land.fixed .pg{color:rgba(42,32,0,.55)}
.land.fixed .badge{display:flex;background:#2a2000;font-size:16px}
.card .t{font-size:18px}
.card .n{font-size:clamp(26px,2.9vw,36px)}
.card .p{font-size:17px}
.card svg{width:40px;height:40px}
.card.solo{width:clamp(220px,24vw,300px)}
.card.solo .n{font-size:clamp(32px,3.6vw,46px)}
.rnote{font-size:clamp(19px,2vw,25px)}
.next{height:68px;font-size:25px;padding:0 38px}
.thead h2{font-size:32px}
.tb{height:52px;font-size:18px}
.panel h3{font-size:21px}
.big{font-size:48px}.big small{font-size:22px}
.miss i{font-size:19px;padding:7px 12px}
.prints{grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.pr{padding:10px 12px}
.pr .pg{font-size:15px;width:40px}
.pr .nm{font-size:19px}
.pr .ct{font-size:24px}
table{font-size:19px}
td{padding:9px 6px}
td:first-child{width:56px}
.tag{font-size:17px;padding:4px 10px}
.setrow label{font-size:19px}
.setrow input{font-size:21px;width:84px}
.note{font-size:17px}
@media (max-width:1100px){ .slot{max-width:130px;flex:0 1 130px} .slot.full{font-size:15px;white-space:normal;line-height:1.15;text-align:left;word-break:keep-all} }

/* 세로 화면 */
@media (orientation:portrait){
  #home{flex-direction:column;justify-content:center}
  .hero{text-align:center;max-width:none}
  .kicker{justify-content:center}
  .pickhead{flex-wrap:wrap}
  .pickhead .ask small{display:block;white-space:normal}
  .slots{margin-left:0;width:100%;order:5}
  .slot{max-width:none!important;flex:1!important}
  .slot{flex:1;min-width:0}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <!-- 픽셀 깃발: 내 땅 표시 -->
  <symbol id="flag" viewBox="0 0 8 8" shape-rendering="crispEdges">
    <rect x="1" y="0" width="1" height="8" fill="currentColor"/>
    <rect x="2" y="0" width="4" height="1" fill="currentColor"/><rect x="2" y="1" width="5" height="1" fill="currentColor"/>
    <rect x="2" y="2" width="5" height="1" fill="currentColor"/><rect x="2" y="3" width="4" height="1" fill="currentColor"/>
  </symbol>
  <symbol id="dice" viewBox="0 0 8 8" shape-rendering="crispEdges">
    <rect x="0" y="0" width="8" height="8" fill="currentColor"/>
    <rect x="1" y="1" width="2" height="2" fill="#ffd23f"/><rect x="5" y="5" width="2" height="2" fill="#ffd23f"/><rect x="3" y="3" width="2" height="2" fill="#ffd23f"/>
  </symbol>
</svg>

<!-- 1. 번호 판 -->
<section class="screen on" id="home">
  <div class="hero">
    <div class="kicker"><svg><use href="#flag"/></svg>픽셀아트 명예의 전당</div>
    <h1>헤맨 만큼<br><em>내 땅</em>이다!</h1>
    <p>내 번호를 누르고<br>넓히고 싶은 <b>땅 2개</b>를 고르세요.</p>
    <div class="meter">
      <div class="lab"><span>고른 친구</span><span><b id="doneN">0</b> / <span id="totN">25</span></span></div>
      <div class="cells" id="cells"></div>
    </div>
  </div>
  <div id="nums"></div>
  <button id="hold" aria-label="선생님 화면 (1초 누르기)">
    <svg class="ring" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="#3d4380" stroke-width="3"/>
      <circle id="ringFill" cx="11" cy="11" r="9" fill="none" stroke="#ffd23f" stroke-width="3" stroke-dasharray="56.5" stroke-dashoffset="56.5" transform="rotate(-90 11 11)"/></svg>
    선생님
  </button>
</section>

<!-- 2. 땅 고르기 -->
<section class="screen" id="pick">
  <div class="pickhead">
    <div class="who px" id="who">7번</div>
    <div class="ask">넓히고 싶은 땅 2개를 고르세요<small>다시 누르면 빠져요 · 이미 이룬 땅도, 앞으로 넓힐 땅도 좋아요</small></div>
    <div class="slots" id="slots"></div>
    <button class="back" id="back">취소</button>
    <button class="go px" id="done" disabled>완료 ▶</button>
  </div>
  <div id="board"></div>
</section>

<!-- 3. 내 땅 공개 -->
<section class="screen" id="reveal">
  <h2 id="rTitle"></h2>
  <div class="four" id="four"></div>
  <div class="rnote" id="rNote"></div>
  <button class="next px" id="next" disabled>다음 친구에게 ▶</button>
</section>

<!-- 4. 선생님 -->
<section class="screen" id="teacher">
  <div class="thead">
    <h2>선생님 화면</h2>
    <button class="tb gold px" id="toKids">아이 화면으로</button>
  </div>
  <div class="tgrid">
    <div>
      <div class="panel px">
        <h3>고른 친구</h3>
        <div class="big" id="tDone"></div>
        <div class="miss" id="tMiss"></div>
      </div>
      <div class="panel px" style="margin-top:14px">
        <h3>도안 인쇄 장수 <span id="tSheets"></span></h3>
        <div class="prints" id="tPrints"></div>
      </div>
    </div>
    <div>
      <div class="panel px">
        <h3>번호별 땅 2개</h3>
        <table id="tTable"></table>
      </div>
      <div class="panel px" style="margin-top:14px">
        <h3>설정</h3>
        <div class="setrow">
          <label>학생 수 <input type="number" id="setStu" min="1" max="40" inputmode="numeric"></label>
          <button class="tb px" id="saveSet">저장</button>
          <button class="tb warn px" id="wipe">전부 지우기</button>
        </div>
        <div class="note" id="wipeNote">친구가 번호를 다시 누르면 고른 땅을 고칠 수 있어요. 표는 이 태블릿에만 저장돼요.</div>
      </div>
    </div>
  </div>
</section>

<div class="confetti" id="confetti"></div>

<script>
/* 도안 목록: 「헤맨만큼내땅이다 픽셀아트도안 전체.pdf」 목차 (쪽 = PDF 쪽) */
const CATS = [
  { name:"학습·수업 태도", c:"var(--c1)", items:[[2,"집중"],[3,"숙제"],[4,"질문"],[5,"책"],[6,"수학"]] },
  { name:"친구 관계",     c:"var(--c2)", items:[[7,"우정"],[8,"화해"],[9,"먼저 다가가기"],[10,"협동"],[11,"나눔"],[12,"감사"]] },
  { name:"건강·생활 습관", c:"var(--c3)", items:[[13,"운동"],[14,"골고루 먹기"],[15,"일찍 자기"],[16,"스마트폰 조절"],[17,"환경"]] },
  { name:"자신감·마음",   c:"var(--c4)", items:[[18,"자신감"],[19,"실패해도 괜찮아"],[20,"감정 표현"],[21,"나다운 길"],[22,"마음 다스리기"],[23,"꾸준함"],[24,"기다림"],[25,"용기"]] },
  { name:"발표·표현",     c:"var(--c5)", items:[[26,"발표"],[27,"그림"],[28,"글쓰기"]] },
  { name:"예체능·도전",   c:"var(--c6)", items:[[29,"음악"],[30,"춤"],[31,"새로운 도전"],[32,"꿈"],[33,"나만의 땅"]] },
];
const LANDS = {}; CATS.forEach(k => k.items.forEach(([p,n]) => LANDS[p] = { p, n, c:k.c }));
const OWN = 33;            // 나만의 땅 (줄무늬 칸)
const PICKS = 2;

/* 저장: 이 태블릿에만 */
const KEY = "heman-land-v1";
let mem = null;
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; }catch(e){}
  return mem || { v:1, students:25, votes:{} };   // votes[번호] = {picks:[쪽…], rand:쪽}
}
function save(){ mem = S; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

const $ = id => document.getElementById(id);
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0,0); }
const flagSvg = '<svg class="flag"><use href="#flag"/></svg>';

/* ---------- 번호 판 ---------- */
const complete = n => S.votes[n] && S.votes[n].picks.length === PICKS;
function renderHome(){
  const nums = $("nums"); nums.innerHTML = "";
  for (let i = 1; i <= S.students; i++){
    const b = document.createElement("button");
    b.className = "num px" + (complete(i) ? " done" : "");
    b.innerHTML = i + flagSvg;
    b.onclick = () => openNum(i);
    nums.appendChild(b);
  }
  let done = 0; for (let i = 1; i <= S.students; i++) if (complete(i)) done++;
  $("doneN").textContent = done; $("totN").textContent = S.students;
  const cells = $("cells"); cells.style.setProperty("--n", S.students);
  cells.innerHTML = Array.from({length:S.students}, (_,i) => `<i class="${complete(i+1) ? "on" : ""}"></i>`).join("");
  show("home");
}

/* ---------- 땅 고르기 ---------- */
let who = null, sel = [];
function cardHtml(L, label, extra=""){
  return `<div class="card px ${extra}" style="--cc:${L.c}"><div class="t">${label}</div><div class="n">${L.n}</div><div class="p">${L.p}쪽</div></div>`;
}
function openNum(n){
  if (!S.votes[n]) { S.votes[n] = { picks:[] }; }
  openPick(n);
}

/* ---------- 2단계: 나머지 2개 고르기 ---------- */
function openPick(n){
  $("confetti").innerHTML = "";
  who = n; const v = S.votes[n]; sel = (v.picks || []).slice();
  $("who").textContent = `${n}번`;
  const board = $("board"); board.innerHTML = "";
  CATS.forEach(k => {
    const col = document.createElement("div"); col.className = "col"; col.style.setProperty("--cc", k.c);
    col.innerHTML = `<div class="colh">${k.name}</div>`;
    k.items.forEach(([p,nm]) => {
      const b = document.createElement("button");
      const fixed = false;
      b.className = "land px" + (p === OWN ? " own" : "") + (fixed ? " fixed" : ""); b.dataset.p = p;
      b.innerHTML = `<span class="nm">${nm}</span><span class="pg">${p}</span><span class="badge">${fixed ? "🎲" : ""}</span>`;
      if (!fixed) b.onclick = () => toggle(p);
      col.appendChild(b);
    });
    board.appendChild(col);
  });
  paintPick(); show("pick");
}
function toggle(p){
  const k = sel.indexOf(p);
  if (k >= 0) sel.splice(k, 1);
  else if (sel.length < PICKS) sel.push(p);
  else { const s = $("slots"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake"); return; }
  paintPick();
}
function paintPick(){
  const full = sel.length >= PICKS;
  document.querySelectorAll("#board .land:not(.fixed)").forEach(b => {
    const k = sel.indexOf(+b.dataset.p);
    b.classList.toggle("sel", k >= 0);
    b.classList.toggle("dim", full && k < 0);
    b.querySelector(".badge").textContent = k >= 0 ? k + 1 : "";
  });
  $("slots").innerHTML = Array.from({length:PICKS}, (_,i) => {
    const L = LANDS[sel[i]];
    return L ? `<button class="slot full px" style="--cc:${L.c}" data-p="${L.p}"><span class="k">${i+1}</span>${L.n}</button>`
             : `<div class="slot px">${i+1}</div>`;
  }).join("");
  document.querySelectorAll("#slots .slot.full").forEach(s => s.onclick = () => toggle(+s.dataset.p));
  $("done").disabled = !full;
}
$("back").onclick = renderHome;
$("done").onclick = () => {
  const v = S.votes[who];
  const edited = v.picks.length === PICKS;
  v.picks = sel.slice(); save();
  $("rTitle").innerHTML = `${who}번의 <em>땅</em>`;
  $("four").innerHTML = v.picks.map((p,i) => cardHtml(LANDS[p], `고른 땅 ${i+1}`, "pop")).join("");
  $("four").querySelectorAll(".pop").forEach((c,i) => c.style.animationDelay = (i * .12) + "s");
  $("rNote").textContent = edited ? "고친 땅으로 바꿨어요." : "이 2개 땅을 색칠해서 명예의 전당에 붙여요!";
  $("next").textContent = "다음 친구에게 ▶"; $("next").onclick = renderHome; $("next").disabled = true;
  show("reveal");
  if (!edited) confetti();
  setTimeout(() => $("next").disabled = false, 700);
};

function confetti(){
  const box = $("confetti"); box.innerHTML = "";
  const cols = ["#ffe45c","#ff5cad","#a6f04d","#a97cff","#4de8ff","#ffa050","#ffd23f"];
  for (let i = 0; i < 70; i++){
    const e = document.createElement("i");
    e.style.left = Math.random() * 100 + "vw";
    e.style.background = cols[i % cols.length];
    e.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    e.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
    e.style.animationDelay = (Math.random() * .4) + "s";
    const s = 6 + Math.round(Math.random() * 3) * 3; e.style.width = e.style.height = s + "px";
    box.appendChild(e);
  }
  setTimeout(() => box.innerHTML = "", 3800);
}

/* ---------- 선생님 화면: 오른쪽 아래 1초 누르기 ---------- */
let holdT = null, holdStart = 0, raf = null;
const hold = $("hold"), ring = $("ringFill");
function holdTick(){
  const t = Math.min(1, (performance.now() - holdStart) / 1000);
  ring.setAttribute("stroke-dashoffset", 56.5 * (1 - t));
  if (t >= 1){ endHold(); openTeacher(); return; }
  raf = requestAnimationFrame(holdTick);
}
function endHold(){ cancelAnimationFrame(raf); hold.classList.remove("holding"); ring.setAttribute("stroke-dashoffset", 56.5); }
hold.addEventListener("pointerdown", e => { e.preventDefault(); holdStart = performance.now(); hold.classList.add("holding"); raf = requestAnimationFrame(holdTick); });
["pointerup","pointerleave","pointercancel"].forEach(ev => hold.addEventListener(ev, endHold));
document.addEventListener("contextmenu", e => e.preventDefault());

function openTeacher(){
  const nums = [], miss = [];
  for (let i = 1; i <= S.students; i++) (complete(i) ? nums : miss).push(i);
  $("tDone").innerHTML = `${nums.length}<small> / ${S.students}명</small>`;
  $("tMiss").innerHTML = miss.length ? miss.map(n => `<i>${n}</i>`).join("") : `<span style="color:var(--c3)">모두 골랐어요!</span>`;

  const cnt = {}; Object.keys(LANDS).forEach(p => cnt[p] = 0);
  nums.forEach(n => { S.votes[n].picks.forEach(p => cnt[p]++); });
  const total = Object.values(cnt).reduce((a,b) => a+b, 0);
  $("tSheets").textContent = `모두 ${total}장`;
  $("tPrints").innerHTML = Object.values(LANDS).map(L =>
    `<div class="pr${cnt[L.p] ? "" : " zero"}" style="--cc:${L.c}"><span class="pg">${L.p}쪽</span><span class="nm">${L.n}</span><span class="ct">${cnt[L.p]}</span></div>`).join("");

  const tag = (p, r) => `<span class="tag${r ? " r" : ""}" style="--cc:${LANDS[p].c}">${LANDS[p].n}</span>`;
  $("tTable").innerHTML = nums.length ? nums.map(n => {
    const v = S.votes[n];
    return `<tr><td>${n}번</td><td>${v.picks.map(p => tag(p)).join("")}</td></tr>`;
  }).join("") : `<tr><td colspan="2" style="color:var(--ink3);font-family:Pretendard">아직 고른 친구가 없어요.</td></tr>`;

  $("setStu").value = S.students;
  wipeArmed = false; $("wipe").textContent = "전부 지우기";
  show("teacher");
}
$("toKids").onclick = renderHome;
$("saveSet").onclick = () => {
  S.students = Math.max(1, Math.min(40, +$("setStu").value || S.students));
  save(); openTeacher();
};
let wipeArmed = false;
$("wipe").onclick = () => {
  if (!wipeArmed){ wipeArmed = true; $("wipe").textContent = "정말요? 한 번 더"; return; }
  S.votes = {}; save(); openTeacher();
};

renderHome();
</script>
</body>
</html>
